services:
  anishare:
    build:
      context: .
      dockerfile: Dockerfile
    image: anishare:latest
    container_name: anishare
    restart: unless-stopped
    ports:
      # 宿主机端口 : 容器端口
      - "${PORT:-8088}:8088"
    volumes:
      # 宿主机番剧目录 : 容器内媒体目录（可改路径或换成只读 :ro）
      - "${BANGUMI_DIR:-/home/sakana/bangumi}:/media"
      # 转码分片缓存（持久化，重启后可直接清理）
      - anishare-data:/app/data
    environment:
      BANGUMI_ROOT: /media
      PORT: 8088
      MEMORY_LIMIT_MB: 512
      NODE_OPTIONS: --max-old-space-size=280
      # 转码参数：内存受限环境下用「省内存」档位（软编线程少、lookahead 小、封装队列小）
      TRANSCODE_THREADS: ${TRANSCODE_THREADS:-2}
      TRANSCODE_RC_LOOKAHEAD: ${TRANSCODE_RC_LOOKAHEAD:-10}
      TRANSCODE_VIDEO_PRESET: ${TRANSCODE_VIDEO_PRESET:-veryfast}
      TRANSCODE_VIDEO_BITRATE: ${TRANSCODE_VIDEO_BITRATE:-}
      TRANSCODE_AUDIO_BITRATE: ${TRANSCODE_AUDIO_BITRATE:-192k}
      TRANSCODE_MUX_QUEUE: ${TRANSCODE_MUX_QUEUE:-512}
      HLS_SEGMENT_SECONDS: ${HLS_SEGMENT_SECONDS:-5}
      HLS_CACHE_MAX_MB: ${HLS_CACHE_MAX_MB:-1024}
      LOG_LEVEL: ${LOG_LEVEL:-info}
    # 内存上限 512MB（Node 堆上限同步约束在 384MB，留出 ffmpeg/原生内存）
    mem_limit: 512m
    memswap_limit: 512m
    # 多路并发转码 + 转码本身占用较多 CPU，按需调整
    cpus: ${CPUS:-4}
    # 有 NVIDIA GPU 且想用 NVENC 时打开（需要 nvidia-container-toolkit）
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - driver: nvidia
    #           count: all
    #           capabilities: [gpu]
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8088/api/status').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

volumes:
  anishare-data:
