# Run with: docker compose --env-file server/.env ...
services:
  server:
    build:
      context: .
      dockerfile: Dockerfile
    image: anishare-server:latest
    container_name: anishare-server
    restart: unless-stopped
    expose:
      - "8088"
    volumes:
      # Each library root must be mounted here and named by its own variable.
      - "${BANGUMI_DIR:-${BANGUMI_ROOT:-/home/sakana/bangumi}}:/media"
      # - /srv/anime:/media/anime:ro
      # - /srv/films:/media/films:ro
      # SQLite, encrypted model settings, and transcode cache survive restarts.
      - anishare-data:/app/data
    environment:
      HOST: 0.0.0.0
      PORT: 8088
      BANGUMI_LIBRARY: /media
      MOVIE_LIBRARY: ${MOVIE_LIBRARY:-}
      AUTH_SECRET: ${AUTH_SECRET:-}
      DB_PATH: /app/data/anishare.sqlite
      SESSION_DAYS: ${SESSION_DAYS:-30}
      COOKIE_SECURE: ${COOKIE_SECURE:-0}
      FRONTEND_ORIGINS: ${FRONTEND_ORIGINS:-}
      AI_ENABLED: ${AI_ENABLED:-0}
      AI_API_FORMAT: ${AI_API_FORMAT:-openai-completions}
      AI_BASE_URL: ${AI_BASE_URL:-}
      AI_MODEL: ${AI_MODEL:-}
      AI_API_KEY: ${AI_API_KEY:-}
      AI_MAX_TOKENS: ${AI_MAX_TOKENS:-2048}
      AI_TIMEOUT_MS: ${AI_TIMEOUT_MS:-30000}
      AI_CONFIG_KEY: ${AI_CONFIG_KEY:-}
      BANGUMI_CRAWLER_ENABLED: ${BANGUMI_CRAWLER_ENABLED:-1}
      BANGUMI_CRAWLER_PROXY_URL: ${BANGUMI_CRAWLER_PROXY_URL:-}
      BANGUMI_CRAWLER_USER_AGENT: ${BANGUMI_CRAWLER_USER_AGENT:-anishare/bangumi-lib/0.1}
      BANGUMI_CRAWLER_TIMEOUT_MS: ${BANGUMI_CRAWLER_TIMEOUT_MS:-15000}
      BANGUMI_CRAWLER_OPERATION_TIMEOUT_MS: ${BANGUMI_CRAWLER_OPERATION_TIMEOUT_MS:-35000}
      BANGUMI_CRAWLER_MAX_RETRIES: ${BANGUMI_CRAWLER_MAX_RETRIES:-1}
      BANGUMI_CRAWLER_MIN_INTERVAL_MS: ${BANGUMI_CRAWLER_MIN_INTERVAL_MS:-1000}
      BANGUMI_CRAWLER_TOKEN: ${BANGUMI_CRAWLER_TOKEN:-}
      DOUBAN_CRAWLER_ENABLED: ${DOUBAN_CRAWLER_ENABLED:-0}
      DOUBAN_CRAWLER_PROXY_URL: ${DOUBAN_CRAWLER_PROXY_URL:-}
      DOUBAN_CRAWLER_TIMEOUT_MS: ${DOUBAN_CRAWLER_TIMEOUT_MS:-20000}
      MEMORY_LIMIT_MB: 512
      NODE_OPTIONS: --max-old-space-size=280
      TRANSCODE_THREADS: ${TRANSCODE_THREADS:-2}
      TRANSCODE_RC_LOOKAHEAD: ${TRANSCODE_RC_LOOKAHEAD:-10}
      TRANSCODE_VIDEO_PRESET: ${TRANSCODE_VIDEO_PRESET:-veryfast}
      TRANSCODE_VIDEO_BITRATE: ${TRANSCODE_VIDEO_BITRATE:-}
      TRANSCODE_AUDIO_BITRATE: ${TRANSCODE_AUDIO_BITRATE:-192k}
      TRANSCODE_MUX_QUEUE: ${TRANSCODE_MUX_QUEUE:-512}
      HLS_SEGMENT_SECONDS: ${HLS_SEGMENT_SECONDS:-5}
      HLS_CACHE_MAX_MB: ${HLS_CACHE_MAX_MB:-1024}
      LOG_LEVEL: ${LOG_LEVEL:-info}
    mem_limit: 512m
    memswap_limit: 512m
    cpus: ${CPUS:-4}
    # NVIDIA support requires nvidia-container-toolkit.
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - driver: nvidia
    #           count: all
    #           capabilities: [gpu]
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8088/api/auth/session').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  web:
    build:
      context: .
      dockerfile: web/Dockerfile
    image: anishare-web:latest
    container_name: anishare-web
    restart: unless-stopped
    ports:
      - "${PORT:-8088}:80"
    depends_on:
      server:
        condition: service_healthy

volumes:
  anishare-data:
